  <style>
:root, [data-theme="light"] {
  --bg:#f2f2f7; --grouped:#f2f2f7; --card:#fff;
  --sep:rgba(60,60,67,.16); --text:#000; --label:#3c3c43;
  --muted:rgba(60,60,67,.6); --blue:#007aff; --green:#34c759;
  --red:#ff3b30; --orange:#ff9500; --fill:rgba(120,120,128,.16);
  --fill-2:rgba(120,120,128,.12); --bar:rgba(255,255,255,.72);
  --shadow:0 8px 30px rgba(0,0,0,.08); --weekend:#fff5f5;
}
[data-theme="dark"] {
  --bg:#000; --grouped:#000; --card:#1c1c1e;
  --sep:rgba(84,84,88,.65); --text:#fff; --label:#ebebf5;
  --muted:rgba(235,235,245,.6); --blue:#0a84ff; --green:#30d158;
  --red:#ff453a; --orange:#ff9f0a; --fill:rgba(120,120,128,.36);
  --fill-2:rgba(120,120,128,.24); --bar:rgba(28,28,30,.86);
  --shadow:0 8px 30px rgba(0,0,0,.45); --weekend:#1a1214;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; font-size:16px; }
button, input, select, textarea { font:inherit; color:inherit; }
.phone { max-width:none; width:100%; margin:0; min-height:100%; display:flex; flex-direction:row; }
.tabbar { width:168px; flex-shrink:0; display:flex; flex-direction:column; gap:4px;
  background:var(--card); border-right:.5px solid var(--sep); padding:48px 10px 16px;
  position:sticky; top:0; align-self:stretch; min-height:100vh; }
.save-btn { background:var(--fill); }
.save-btn.dirty { background:#ff9f0a; color:#000; }
.exit-btn { background:none; border:0; color:var(--red); font-weight:600; padding:10px 12px; border-radius:12px; cursor:pointer; text-align:left; width:100%; }
.tabbar button { background:none; border:0; color:var(--muted); display:flex; align-items:center; gap:10px;
  font-size:15px; font-weight:600; cursor:pointer; text-align:left; padding:10px 12px; border-radius:12px; width:100%; }
.tabbar button.on { color:var(--blue); background:var(--fill-2); }
.maincol { flex:1; min-width:0; display:flex; flex-direction:column; min-height:100vh; }
.nav-head { padding:16px 20px 8px; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.large-title { font-size:32px; font-weight:700; letter-spacing:-.5px; margin:0; }
.link { background:none; border:0; color:var(--blue); padding:6px 0; font-weight:500; cursor:pointer; }
.scroll { flex:1; overflow:auto; padding:0 20px 40px; }
.seg { display:flex; background:var(--fill); border-radius:9px; padding:2px; margin:8px 0 12px; overflow:auto; }
.seg button { flex:1 0 auto; min-width:52px; border:0; background:transparent; color:var(--text); padding:6px 10px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; }
.seg button.on { background:var(--card); box-shadow:0 1px 4px rgba(0,0,0,.12); }
.kpi-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
.kpi { background:var(--card); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow); }
.kpi .label { font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
.kpi .value { font-size:22px; font-weight:700; margin-top:2px; }
.kpi .sub { font-size:12px; color:var(--muted); }
.group-title { font-size:13px; color:var(--muted); font-weight:500; text-transform:uppercase; letter-spacing:.4px; padding:8px 4px 6px; }
.inset { background:var(--card); border-radius:12px; overflow:hidden; }
.cell { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; min-height:44px; border-bottom:.5px solid var(--sep); }
.cell:last-child { border-bottom:0; }
.year-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
@media (max-width:1600px){ .year-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:1200px){ .year-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:860px){ .year-grid { grid-template-columns:1fr; } }
.menu-btn { display:none; background:var(--fill); border:0; border-radius:10px; width:40px; height:40px; font-size:20px; cursor:pointer; color:var(--text); }
@media (max-width:640px){
  .phone { flex-direction:column; }
  .menu-btn { display:flex; align-items:center; justify-content:center; }
  .tabbar {
    display:none; position:fixed; top:56px; left:8px; right:8px; z-index:30;
    width:auto; flex-direction:column; gap:2px; padding:8px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    border:0; max-height:70vh; overflow:auto;
  }
  .tabbar.open { display:flex; }
  .tabbar button { width:100%; font-size:16px; padding:12px 14px; white-space:normal; }
  .brand { padding:4px 8px 8px; }
  .nav-head { padding:10px 12px 6px; flex-wrap:wrap; gap:6px; align-items:center; }
  .large-title { font-size:22px; flex:1; min-width:0; }
  .scroll { padding:0 12px 28px; }
  .kpi-row { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .kpi .value { font-size:20px; }
  .month { padding:10px 8px 8px; }
  .day { min-height:44px; font-size:10px; padding:2px; }
  .day .dnum { font-size:11px; }
  .chip { font-size:9px; padding:1px 3px; }
  .btn { padding:12px 14px; font-size:15px; }
  .field input, .field select, .field textarea { padding:12px; font-size:16px; }
  .sheet .box { padding:16px 14px 40px; border-radius:16px 16px 0 0; }
  .rowbtns { gap:6px; }
  .cell { padding:10px 12px; }
}
.month { background:var(--card); border-radius:14px; padding:12px 10px 10px; }
.month h3 { margin:0 0 8px; text-align:left; font-size:16px; padding:0 4px; }
.wdays { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); text-align:center; font-size:11px; color:var(--muted); font-weight:600; margin-bottom:4px; }
.days { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; }
.day { min-height:52px; border-radius:6px; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;
  font-size:11px; cursor:pointer; position:relative; border:0; background:var(--fill-2); color:var(--text); padding:2px 3px; text-align:left; overflow:hidden; }
.day.empty { cursor:default; background:transparent; min-height:52px; }
.day.wknd { background:var(--weekend); color:var(--muted); }
.day.hol { color:var(--red); }
.day.today { outline:2px solid var(--blue); outline-offset:-1px; }
.day .dnum { font-size:12px; font-weight:700; line-height:1.2; display:flex; justify-content:space-between; align-items:center; }
.day .chips { display:flex; flex-direction:column; gap:2px; margin-top:3px; min-height:0; }
.chip { display:block; font-size:10px; line-height:1.25; font-weight:600; border-radius:4px; padding:2px 4px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-left:4px; cursor:pointer; flex-shrink:0; }
.dot.red { background:#ff453a; }
.dot.green { background:#30d158; }
.day.night .dnum::after { content:"☾"; color:#7c5cff; font-weight:700; }
.legend { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px; }
.legend span { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.sw { width:10px; height:10px; border-radius:50%; display:inline-block; }
.sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none; align-items:flex-end; justify-content:center; }
.sheet.on { display:flex; }
.sheet .box { background:var(--card); width:min(520px,100%); max-height:92vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px 28px; }
.sheet h2 { margin:0 0 12px; font-size:20px; }
.field { margin-bottom:10px; }
.field label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
.field input, .field select, .field textarea {
  width:100%; background:var(--fill-2); border:0; border-radius:10px; padding:10px 12px; }
.rowbtns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.btn { border:0; border-radius:12px; padding:10px 14px; font-weight:600; cursor:pointer; background:var(--fill); color:var(--text); }
.btn.pri { background:var(--blue); color:#fff; }
.btn.danger { background:var(--red); color:#fff; }
.status-pill { font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; }
.st-plan { background:#3a3a3c; color:#fff; }
.st-com { background:#ff9f0a33; color:var(--orange); }
.st-apr { background:#30d15833; color:var(--green); }
.evcard { border-left:4px solid; padding:8px 10px; border-radius:8px; background:var(--fill-2); margin:6px 0; }
.lock {
  position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; align-items:center; justify-content:center;
}
.lock .card { width:min(360px,92vw); background:var(--card); border-radius:16px; padding:24px 20px; box-shadow:var(--shadow); }
.lock h2 { margin:0 0 8px; }
.lock p { color:var(--muted); font-size:14px; margin:0 0 14px; }
.lock input { width:100%; background:var(--fill-2); border:0; border-radius:10px; padding:12px; margin-bottom:10px; letter-spacing:2px; }
.lock .err { color:var(--red); font-size:13px; min-height:18px; }
.alertbox { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; }
.alertbox.on { display:flex; }
.alertbox .card { width:min(520px,94vw); max-height:80vh; overflow:auto; background:var(--card); border-radius:16px; padding:20px; }
.logo { width:36px; height:36px; display:block; flex-shrink:0; }
.logo.lg { width:56px; height:56px; margin:0 auto 12px; }
.brand { display:flex; align-items:center; gap:10px; padding:0 8px 16px; }
.brand span { font-weight:700; font-size:15px; color:var(--text); line-height:1.15; }
.pinpad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
.pinbtn { background:var(--fill); border:0; border-radius:12px; padding:16px 0; font-size:22px; font-weight:600; color:var(--text); cursor:pointer; }
.pinbtn:active { background:var(--fill-2); }

@media print {
  @page { size: A4 landscape; margin: 6mm; }
  html, body {
    background: #fff !important;
    color: #111 !important;
    height: 100% !important;
    margin: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .tabbar, .sheet, .link, .nav-head, .lock, .alertbox, .kpi-row, .legend, .year-grid, #view { display: none !important; }
  .phone, .maincol { display: block; width: 100%; height: 100%; }
  .scroll { display: block; width: 100%; height: 100%; overflow: visible; padding: 0; }
  #printSheet { display: flex !important; flex-direction: column; height: 100%; width: 100%; }
  .print-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .print-title { font-size: 14px; font-weight: 700; margin: 0; }
  .print-kpis { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 8px; }
  .print-kpis b { font-size: 11px; }
  .print-legend { display: flex; flex-wrap: wrap; gap: 8px; font-size: 8px; margin-bottom: 4px; }
  .print-legend span { display: inline-flex; align-items: center; gap: 3px; }
  .print-table { width: 100%; height: 100%; border-collapse: collapse; font-size: 7px; table-layout: fixed; }
  .print-table th, .print-table td { border: 0.4px solid #bbb; text-align: center; padding: 0; position: relative; vertical-align: top; }
  .print-table th { background: #eee; font-weight: 600; height: 14px; }
  .print-month { text-align: left !important; padding-left: 3px !important; font-weight: 700; white-space: nowrap; width: 36px; background: #f7f7f7; font-size: 8px; }
  .print-wknd { background: #f0f0f0; color: #999; }
  .print-hol { color: #111; font-weight: 700; }
  .print-event { color: #111; font-weight: 600; }
  .print-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 25%; opacity: 0.5; }
  .print-wd { display: block; font-size: 6px; line-height: 1; color: #666; }
  .print-night { box-shadow: inset 0 0 0 1.5px #7c5cff; }
  .print-trips { margin-top: 4px; font-size: 8px; }
  .print-trips table { width: 100%; border-collapse: collapse; }
  .print-trips th, .print-trips td { border: 0.4px solid #ccc; padding: 2px 4px; text-align: left; }
}

</div>
<div class="phone">
  <nav class="tabbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#0a84ff"/>
        <rect x="8" y="14" width="48" height="42" rx="6" fill="#fff"/>

        <rect x="28" y="42" width="8" height="6" rx="1" fill="#ff453a"/>
      </svg>
      <span id="brandName">Calendario Familia</span>
      <span id="brandVer" style="font-size:11px;color:var(--muted);font-weight:500">v1.6.1</span>

    <button class="btn save-btn" id="btnSave" onclick="saveChanges()" style="margin:0 8px 12px;width:calc(100% - 16px)">Guardar cambios</button>
    <button class="on" data-tab="dash" onclick="go('dash')" id="tab-dash">Dashboard</button>
    <button data-tab="plan" onclick="go('plan')" id="tab-plan">Calendario</button>
    <button data-tab="totales" onclick="go('totales')" id="tab-totales">Totales</button>
    <button data-tab="viajes" onclick="go('viajes')" id="tab-viajes">Viajes</button>
    <button data-tab="compras" onclick="go('compras')" id="tab-compras">Compras</button>
    <button data-tab="limpieza" onclick="go('limpieza')" id="tab-limpieza">Limpieza</button>
    <button data-tab="tipos" onclick="go('tipos')" id="tab-tipos">Tipos</button>
    <button data-tab="opciones" onclick="go('opciones')" id="tab-opciones">Opciones</button>
    <div style="flex:1"></div>
    <button class="exit-btn" onclick="exitApp()" style="margin-top:auto">Salir</button>
  </nav>
  <div class="maincol">
    <div class="nav-head">

      <button class="link" id="yearBtn" onclick="void 0"></button>
      <button class="link" onclick="shiftYear(1)">›</button>
      <button class="link" id="btnPrint" onclick="printPlan()">Imprimir PDF</button>

    </div>
    <div class="scroll" id="view"></div>
    <div id="printSheet" style="display:none"></div>
  </div>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="box" id="sheetBox"></div>
</div>
<div class="alertbox" id="pendingBox" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="card" id="pendingCard"></div>
</div>

function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
    g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
    l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(Date.UTC(y,month-1,day));
}

async function saveToSupabase(manual){
  const s = state.sb || {};
  if (!s.url || !s.key) { if (manual) alert(t('sbFail')+': falta URL o clave'); return; }
  try {
    const client = await sbClient();
    const payload = planPayload();
    // Refuse to wipe existing data with an empty local plan
    const { data: cur } = await client.from('plan').select('data').eq('id',1).maybeSingle();
    const remoteN = (cur && cur.data && cur.data.events) ? cur.data.events.length : 0;
    const localN = (payload.events||[]).length;
    if (remoteN > 0 && localN === 0) {
      if (manual) alert('No se guardó: el plan local está vacío y en la nube hay '+remoteN+' eventos. Recarga la página.');
      return;
    }
    if (manual && remoteN > localN + 2 && !confirm('En la nube hay más eventos ('+remoteN+') que aquí ('+localN+'). ¿Pisar la nube igual?')) return;
    // Keep last versions inside the same row so we can recover
    const hist = (cur && cur.data && cur.data._history) ? cur.data._history.slice(0,4) : [];
    if (cur && cur.data) hist.unshift({ at: new Date().toISOString(), data: cur.data });
    payload._history = hist;
    try { await client.from('plan_history').insert({ data: payload, saved_at: new Date().toISOString() }); } catch(e) {}
    const { error } = await client.from('plan').upsert({ id:1, data:payload, updated_at:new Date().toISOString() });
    if (error) throw error;
    if (manual) alert(t('sbOk'));
  } catch(e) {
    if (manual) alert(t('sbFail')+': '+(e.message||e));
  }
}

function typeById(id){ return state.types.find(t=>t.id===id); }

function holMap(){

  (state.extraHolidays||[]).forEach(h => {

  });
  return base;

function isWeekend(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const w = d.getDay();
  return w===0 || w===6;
}
function isWorkday(dateStr){
  if (isWeekend(dateStr)) return false;
  if (holMap()[dateStr]) return false;
  const evs = eventsOn(dateStr);
  const off = evs.some(e => {
    const t = typeById(e.typeId);
    return t && (t.id==='vac' || t.id==='per' || t.id==='baj' || /vac|permiso|baja|libre/i.test(t.name));
  });
  return !off;
}

function stats(){

  const end = new Date(Date.UTC(y,11,31));
  for (let d=new Date(start); d<=end; d.setUTCDate(d.getUTCDate()+1)){

    if (hol[ds]) hols++;
    if (isWeekend(ds)) weekends++;
    if (isWorkday(ds)) work++;
  }
  const seenNight = new Set();
  state.events.forEach(e => {
    if (!e.date.startsWith(String(y))) return;
    if (byType[e.typeId]) {
      byType[e.typeId].days++;
      if (e.status==='planificado') byType[e.typeId].plan++;
      if (e.status==='comunicado') byType[e.typeId].com++;
      if (e.status==='aprobado') byType[e.typeId].apr++;
    }
    if (e.night && !seenNight.has(e.date)) { nights++; seenNight.add(e.date); }
  });
  // nights marked even without event
  state.events.filter(e=>e.night && e.date.startsWith(String(y))).forEach(()=>{});
  return {work, nights, hols, weekends, byType};
}

async function loadDashWeather(){
  const box = document.getElementById('dashWx');
  if (!box) return;
  const ds = state.dashDate || iso(new Date());
  const lat = 39.2238, lon = 9.1217;
  try {
    const today = iso(new Date());
    const horizon = iso(addDays(new Date(), 16));
    if (ds >= today && ds <= horizon) {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,weathercode&timezone=Europe/Rome&start_date=${ds}&end_date=${ds}`);
      const j = await r.json();
      const times = j.hourly?.time || [];
      const temps = j.hourly?.temperature_2m || [];
      const codes = j.hourly?.weathercode || [];
      if (!times.length) throw 0;
      const min = Math.round(Math.min(...temps));
      const max = Math.round(Math.max(...temps));
      const nowH = new Date().getHours();
      const isToday = ds === today;
      const order = times.map((t,i)=>({t,i,h:parseInt(t.slice(11,13),10)}));
      if (isToday) order.sort((a,b)=> ((a.h-nowH+24)%24) - ((b.h-nowH+24)%24));
      let rows = '';
      order.forEach(({t,i})=>{
        const h = t.slice(11,16);
        const cur = isToday && parseInt(t.slice(11,13),10)===nowH;
        rows += `<div class="cell"${cur?' style="background:var(--fill)"':''}><div class="name">${h}${cur?' · ahora':''}</div><div>${Math.round(temps[i])}° · ${wxLabel(codes[i])||'—'}</div></div>`;
      });
      box.innerHTML = `<div class="cell"><div class="name" style="font-size:24px;font-weight:700">${min}–${max}°C</div><div class="meta">Por hora · Cagliari</div></div>${rows}`;
    } else {
      const acc = {n:0,min:0,max:0};
      for (const y of [1,2,3]) {
        const past = shiftYearDate(ds, -y);
        const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=${past}&end_date=${past}&daily=temperature_2m_max,temperature_2m_min&timezone=Europe/Rome`);
        const j = await r.json();
        if (j.daily && j.daily.temperature_2m_min) {
          acc.n++; acc.min += j.daily.temperature_2m_min[0]; acc.max += j.daily.temperature_2m_max[0];
        }
      }
      const temp = acc.n ? `${Math.round(acc.min/acc.n)}–${Math.round(acc.max/acc.n)}°C` : '—';
      box.innerHTML = `<div class="cell"><div class="name" style="font-size:24px;font-weight:700">${temp}</div><div class="meta">${t('weatherAvg')} · Cagliari</div></div>`;
    }
  } catch(e) {
    box.innerHTML = `<div class="cell"><div class="meta">${t('weatherFail')}</div></div>`;
  }
}

  const map = {0:'Despejado',1:'Casi despejado',2:'Parcialmente nublado',3:'Nublado',45:'Niebla',48:'Niebla',51:'Llovizna',61:'Lluvia',63:'Lluvia',65:'Lluvia fuerte',71:'Nieve',80:'Chubascos',95:'Tormenta'};

    const dim = new Date(state.year, m+1, 0).getDate();
    grid += `<div class="month"><h3>${MONTHS[state.lang][m]}</h3><div class="wdays">${WDAYS[state.lang].map(w=>`<span>${w}</span>`).join('')}</div><div class="days">`;

      const ds = `${state.year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const evs = eventsOn(ds).filter(e=>isTypeVisible(e.typeId));
      const wkd = isWeekend(ds);

      const cls = ['day', wkd?'wknd':'', isHol?'hol':'', today?'today':'', night?'night':''].filter(Boolean).join(' ');
      const stShort = {planificado:'P', comunicado:'C', aprobado:'A'};

      tripsOn(ds).forEach(tr=>{
        chips += `<span class="chip" style="background:#64d2ff;color:#00344d">✈ ${esc(tr.name||tr.dest||t('trips'))}</span>`;
      });
      evs.forEach(e=>{
        const tp = typeById(e.typeId);
        const label = `${tp?tp.name:t('event')} · ${stShort[e.status]||e.status}${e.note? ' · '+e.note:''}`;
        chips += `<span class="chip" style="background:${tp?tp.color:'#636366'}">${esc(label)}${tp&&tp.workVac?`<span class="dot ${e.status==='aprobado'?'green':'red'}" onclick="toggleVacStatus('${e.id}',event)" title="Clic: aprobada / pendiente"></span>`:''}</span>`;
      });
      const title = [isHol?hol[ds]:'', ...evs.map(e=>{
        const tp=typeById(e.typeId); return tp?`${tp.name} (${e.status})${e.note?' — '+e.note:''}`:e.status;
      })].filter(Boolean).join(' · ');
      grid += `<button class="${cls}" title="${esc(title)}" onclick="openDay('${ds}')"><span class="dnum">${d}</span><span class="chips">${chips}</span></button>`;
    }
    grid += `</div></div>`;
  }
  grid += `</div>`;
  return kpi + legend + grid;
}

function vacationBalance(){
  const vacType = state.types.find(tp=>tp.workVac);
  const y = String(state.year);
  let planned=0, approved=0, pending=0;
  if (vacType) {
    state.events.filter(e=>e.typeId===vacType.id && e.date.startsWith(y)).forEach(e=>{
      planned++;
      if (e.status==='aprobado') approved++; else pending++;
    });
  }
  const allowance = Number(state.annualLeave)||0;
  const prev = Number(state.prevYearDays)||0;
  return { planned, approved, pending, allowance, prev, remaining: allowance + prev - planned };
}

const IDB = 'planAnual.dir';
function idbSet(h){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(IDB,1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onsuccess = () => { const tx=r.result.transaction('k','readwrite'); tx.objectStore('k').put(h,'dir'); tx.oncomplete=()=>res(); };
    r.onerror = () => rej(r.error);
  });
}
function idbGet(){
  return new Promise((res)=>{
    const r = indexedDB.open(IDB,1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onsuccess = () => { const tx=r.result.transaction('k'); const g=tx.objectStore('k').get('dir'); g.onsuccess=()=>res(g.result||null); };
    r.onerror = () => res(null);
  });
}

}

    const sum = `${tp?tp.name:t('event')}${e.night?' · '+t('night'):''} [${statusLabel(e.status)}]`;

    <div class="kpi"><div class="label">MARY (martes)</div><div class="value">${totals.MARY}</div><div class="sub">horas en el mes</div></div>
    <div class="kpi"><div class="label">GIADA (jueves)</div><div class="value">${totals.GIADA}</div><div class="sub">horas en el mes</div></div>
  </div>
  <div class="group-title">Registros ${ym}</div>
  <div class="inset">${rows}</div>
  <p style="color:var(--muted);font-size:13px;margin-top:10px">Mary suele venir los martes y Giada los jueves. Marca el día, si vino y las horas.</p>`;
}
function addClean(){
  const date = document.getElementById('clDate').value;
  const person = document.getElementById('clWho').value;
  const hours = Number(document.getElementById('clHours').value)||0;
  const came = document.getElementById('clCame').checked;
  if (!date) return;
  state.cleaning = state.cleaning || [];
  state.cleaning.push({id:uid(), date, person, hours, came});
  save(); render();
}
function delClean(id){
  state.cleaning = (state.cleaning||[]).filter(c=>c.id!==id);
  save(); render();
}

function renderCompras(){
  const list = state.shopping || [];
  const pending = list.filter(i=>!i.done);
  const done = list.filter(i=>i.done);
  let html = `<div class="rowbtns" style="align-items:flex-end;margin-bottom:12px">
    <div class="field" style="margin:0;flex:1;min-width:160px"><label>${t('shopping')}</label>
      <input id="newItem" placeholder="${t('itemPh')}" onkeydown="if(event.key==='Enter')addShopItem()"></div>
    <button class="btn pri" onclick="addShopItem()">${t('addItem')}</button>
  </div>`;
  if (!list.length) html += `<div class="inset"><div class="cell"><div class="meta">${t('noItems')}</div></div></div>`;
  if (pending.length) {
    html += `<div class="group-title">${t('shopping')}</div><div class="inset">`;
    pending.forEach(i => html += `<div class="cell">
      <label style="display:flex;gap:10px;align-items:center;flex:1;cursor:pointer">
        <input type="checkbox" onchange="toggleShop('${i.id}')"> <span>${esc(i.name)}</span>
      </label>
      <button class="link" onclick="delShop('${i.id}')">${t('delete')}</button>
    </div>`);
    html += `</div>`;
  }
  if (done.length) {
    html += `<div class="group-title">${t('bought')}</div><div class="inset">`;
    done.forEach(i => html += `<div class="cell">
      <label style="display:flex;gap:10px;align-items:center;flex:1;cursor:pointer;opacity:.6">
        <input type="checkbox" checked onchange="toggleShop('${i.id}')"> <span style="text-decoration:line-through">${esc(i.name)}</span>
      </label>
      <button class="link" onclick="delShop('${i.id}')">${t('delete')}</button>
    </div>`);
    html += `</div>`;
    html += `<div class="rowbtns"><button class="btn danger" onclick="clearBought()">${t('clearBought')}</button></div>`;
  }
  return html;
}
function addShopItem(){
  const inp = document.getElementById('newItem');
  const name = (inp?.value||'').trim();
  if (!name) return;
  state.shopping = state.shopping || [];
  state.shopping.push({id:uid(), name, done:false});
  save(); render();
}
function toggleShop(id){
  const i = (state.shopping||[]).find(x=>x.id===id);
  if (i) { i.done = !i.done; save(); render(); }
}
function delShop(id){
  state.shopping = (state.shopping||[]).filter(x=>x.id!==id);
  save(); render();
}
function clearBought(){
  state.shopping = (state.shopping||[]).filter(x=>!x.done);
  save(); render();
}

function renderViajes(){
  const list = (state.trips||[]).slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  let html = `<p style="color:var(--muted);font-size:14px">${t('onCal')}</p>
    <div class="rowbtns"><button class="btn pri" onclick="openTrip()">${t('newTrip')}</button></div>`;
  if (!list.length) html += `<div class="inset"><div class="cell"><div class="meta">${t('noTrips')}</div></div></div>`;
  list.forEach(tr=>{
    const n = daysInRange(tr.start,tr.end).length;
    const fl = (tr.flights||[]).map(f=>`${f.number||''} ${f.from||''}→${f.to||''}`).filter(s=>s.trim()).join(' · ');
    html += `<div class="inset" style="margin-bottom:12px">
      <div class="cell" onclick="openTrip('${tr.id}')" style="cursor:pointer">
        <div class="left"><div class="name">✈ ${esc(tr.name||tr.dest||t('trips'))}</div>
        <div class="meta">${tr.start||'—'} → ${tr.end||'—'} · ${n} ${t('tripDays')}${tr.dest?' · '+esc(tr.dest):''}${fl?' · '+esc(fl):''}</div></div>
        <span class="chev">›</span>
      </div></div>`;
  });
  return html;
}
function openTrip(id){
  const tr = id ? tripById(id) : {id:uid(), name:'', dest:'', start:'', end:'', flights:[], dayNotes:{}, weather:null};
  if (id && !tr) return;
  window._tripDraft = JSON.parse(JSON.stringify(tr));
  paintTripSheet();
  document.getElementById('sheet').classList.add('on');
  if (tr.dest && tr.start && tr.end) loadWeather(window._tripDraft);
}
function paintTripSheet(){
  const tr = window._tripDraft;
  const days = daysInRange(tr.start, tr.end);
  let flHtml = (tr.flights||[]).map((f,i)=>`<div class="evcard" style="border-color:#64d2ff">
    <div class="field"><label>${t('flightNo')}</label><input value="${esc(f.number||'')}" onchange="_tripDraft.flights[${i}].number=this.value"></div>
    <div class="rowbtns">
      <div class="field" style="flex:1"><label>${t('depAirport')}</label><input value="${esc(f.from||'')}" onchange="_tripDraft.flights[${i}].from=this.value.toUpperCase()"></div>
      <div class="field" style="flex:1"><label>${t('arrAirport')}</label><input value="${esc(f.to||'')}" onchange="_tripDraft.flights[${i}].to=this.value.toUpperCase()"></div>
    </div>
    <div class="rowbtns">
      <div class="field" style="flex:1"><label>${t('depTime')}</label><input type="datetime-local" value="${esc(f.dep||'')}" onchange="_tripDraft.flights[${i}].dep=this.value"></div>
      <div class="field" style="flex:1"><label>${t('arrTime')}</label><input type="datetime-local" value="${esc(f.arr||'')}" onchange="_tripDraft.flights[${i}].arr=this.value"></div>
    </div>
    <button class="btn danger" onclick="_tripDraft.flights.splice(${i},1);paintTripSheet()">${t('remove')}</button>
  </div>`).join('');
  let notes = days.map(d=>`<div class="field"><label>${d}${tr.weather&&tr.weather[d]?' · '+tr.weather[d]:''}</label>
    <textarea rows="2" onchange="_tripDraft.dayNotes=Object.assign(_tripDraft.dayNotes||{},{'${d}':this.value})">${esc((tr.dayNotes||{})[d]||'')}</textarea></div>`).join('');
  document.getElementById('sheetBox').innerHTML = `<h2>✈ ${esc(tr.name||t('newTrip'))}</h2>
    <div class="field"><label>${t('tripName')}</label><input value="${esc(tr.name||'')}" onchange="_tripDraft.name=this.value"></div>
    <div class="field"><label>${t('dest')}</label><input id="tripDest" value="${esc(tr.dest||'')}" onchange="_tripDraft.dest=this.value"></div>
    <div class="rowbtns">
      <div class="field" style="flex:1"><label>${t('from')}</label><input type="date" value="${esc(tr.start||'')}" onchange="_tripDraft.start=this.value;paintTripSheet()"></div>
      <div class="field" style="flex:1"><label>${t('to')}</label><input type="date" value="${esc(tr.end||'')}" onchange="_tripDraft.end=this.value;paintTripSheet()"></div>
    </div>
    <div class="group-title">${t('flights')}</div>
    <p style="color:var(--muted);font-size:13px;margin:0 0 8px">${t('flightHint')}</p>
    <div class="rowbtns">
      <input id="lkNum" placeholder="IB6455" style="flex:1;background:var(--fill-2);border:0;border-radius:10px;padding:10px">
      <input id="lkDate" type="date" style="background:var(--fill-2);border:0;border-radius:10px;padding:10px">
      <button class="btn pri" onclick="lookupFlight()">${t('lookupFlight')}</button>
      <button class="btn" onclick="openGoogleFlights()">${t('openGFlights')}</button>
    </div>
    ${flHtml}
    <button class="btn" onclick="addBlankFlight()">${t('addFlight')}</button>
    <div class="group-title">${t('weather')}</div>
    <div id="wxBox" class="inset"><div class="cell"><div class="meta">${t('weatherLoading')}</div></div></div>
    <button class="btn" style="margin-top:8px" onclick="loadWeather(_tripDraft)">${t('weather')}</button>
    <div class="group-title">${t('dayPlan')}</div>
    ${notes||'<p style="color:var(--muted)">—</p>'}
    <div class="rowbtns">
      <button class="btn pri" onclick="commitTrip()">${t('saveTrip')}</button>
      ${tripById(tr.id)?`<button class="btn danger" onclick="delTrip('${tr.id}')">${t('deleteTrip')}</button>`:''}
      <button class="btn" onclick="closeSheet()">${t('close')}</button>
    </div>`;
  renderWx(tr);
}
function addBlankFlight(){
  window._tripDraft.flights = window._tripDraft.flights||[];
  window._tripDraft.flights.push({id:uid(), number:'', from:'', to:'', dep:'', arr:''});
  paintTripSheet();
}
function commitTrip(){
  const tr = window._tripDraft;
  if (!tr.start || !tr.end) { closeSheet(); return; }
  state.trips = state.trips||[];
  const i = state.trips.findIndex(x=>x.id===tr.id);
  if (i>=0) state.trips[i]=tr; else state.trips.push(tr);
  save(); closeSheet(); render();
}
function delTrip(id){
  state.trips = (state.trips||[]).filter(x=>x.id!==id);
  save(); closeSheet(); render();
}
async function lookupFlight(){
  const num = (document.getElementById('lkNum').value||'').replace(/\s+/g,'').toUpperCase();
  const date = document.getElementById('lkDate').value;
  if (!num) return;
  const key = state.aviationKey;
  let f = {id:uid(), number:num, from:'', to:'', dep:'', arr:'', date};
  if (!key) {
    openGoogleFlights();
    alert(t('lookupNeedKey'));
    window._tripDraft.flights = window._tripDraft.flights||[];
    window._tripDraft.flights.push(f);
    paintTripSheet();
    return;
  }
  try {
    const url = `https://api.aviationstack.com/v1/flights?access_key=${encodeURIComponent(key)}&flight_iata=${encodeURIComponent(num)}${date?'&flight_date='+encodeURIComponent(date):''}&limit=1`;
    const r = await fetch(url);
    const j = await r.json();
    const d = (j.data&&j.data[0]) || null;
    if (d) {
      f.from = (d.departure?.iata || '').toUpperCase();
      f.to = (d.arrival?.iata || '').toUpperCase();
      const dep = d.departure?.scheduled || d.departure?.estimated || '';
      const arr = d.arrival?.scheduled || d.arrival?.estimated || '';
      f.dep = dep ? dep.replace(' ', 'T').slice(0,16) : '';
      f.arr = arr ? arr.replace(' ', 'T').slice(0,16) : '';
      if (f.dep) window._tripDraft.start = window._tripDraft.start || f.dep.slice(0,10);
      if (f.arr) window._tripDraft.end = window._tripDraft.end || f.arr.slice(0,10);
      if (d.arrival?.airport) window._tripDraft.dest = window._tripDraft.dest || d.arrival.airport;
      alert(t('lookupOk') + (f.from&&f.to ? ` (${f.from}→${f.to})` : ''));
    } else {
      alert(t('lookupFail'));
      openGoogleFlights();
    }
  } catch(e){
    alert(t('lookupFail'));
    openGoogleFlights();
  }
  window._tripDraft.flights = window._tripDraft.flights||[];
  window._tripDraft.flights.push(f);
  paintTripSheet();
}
function openGoogleFlights(){
  const num = (document.getElementById('lkNum')?.value||'').replace(/\s+/g,'').toUpperCase();
  const date = document.getElementById('lkDate')?.value || '';
  const q = [num, date].filter(Boolean).join(' ');
  const url = q
    ? 'https://www.google.com/travel/flights?q=' + encodeURIComponent(q)
    : 'https://www.google.com/travel/flights';
  window.open(url, '_blank');
}
async function geocodeCity(name){
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language='+(state.lang||'es')+'&name='+encodeURIComponent(name));
  const j = await r.json();
  return (j.results&&j.results[0]) || null;
}
async function loadWeather(tr){
  const box = document.getElementById('wxBox');
  if (box) box.innerHTML = `<div class="cell"><div class="meta">${t('weatherLoading')}</div></div>`;
  if (!tr.dest || !tr.start || !tr.end) { renderWx(tr); return; }
  try {
    const geo = await geocodeCity(tr.dest);
    if (!geo) throw 0;
    tr.lat = geo.latitude; tr.lon = geo.longitude;
    const today = iso(new Date());
    const horizon = iso(addDays(new Date(), 16));
    const useFc = tr.start <= horizon;
    let wx = {};
    if (useFc) {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.latitude}&longitude=${geo.longitude}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=auto&start_date=${tr.start}&end_date=${tr.end}`);
      const j = await r.json();
      (j.daily?.time||[]).forEach((d,i)=>{
        wx[d] = `${Math.round(j.daily.temperature_2m_min[i])}–${Math.round(j.daily.temperature_2m_max[i])}°`;
      });
      tr.weatherKind = 'forecast';
    } else {
      const years = [1,2,3];
      const acc = {};
      for (const y of years) {
        const s = shiftYearDate(tr.start, -y), e = shiftYearDate(tr.end, -y);
        const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${geo.latitude}&longitude=${geo.longitude}&start_date=${s}&end_date=${e}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
        const j = await r.json();
        (j.daily?.time||[]).forEach((d,i)=>{
          const key = d.slice(5);
          acc[key] = acc[key] || {n:0,min:0,max:0};
          acc[key].n++; acc[key].min += j.daily.temperature_2m_min[i]; acc[key].max += j.daily.temperature_2m_max[i];
        });
      }
      daysInRange(tr.start,tr.end).forEach(d=>{
        const a = acc[d.slice(5)];
        if (a&&a.n) wx[d] = `${Math.round(a.min/a.n)}–${Math.round(a.max/a.n)}°`;
      });
      tr.weatherKind = 'avg';
    }
    tr.weather = wx;
  } catch(e){ tr.weather = tr.weather||null; tr.weatherKind='fail'; }
  renderWx(tr);
}
function shiftYearDate(ds, dy){
  const d = new Date(ds+'T12:00:00');
  d.setFullYear(d.getFullYear()+dy);
  return iso(d);
}
function renderWx(tr){
  const box = document.getElementById('wxBox');
  if (!box) return;
  if (tr.weatherKind==='fail') { box.innerHTML = `<div class="cell"><div class="meta">${t('weatherFail')}</div></div>`; return; }
  if (!tr.weather) { box.innerHTML = `<div class="cell"><div class="meta">${t('weather')}</div></div>`; return; }
  const label = tr.weatherKind==='avg' ? t('weatherAvg') : t('weatherForecast');
  let html = `<div class="cell"><div class="meta">${label}${tr.dest?' · '+esc(tr.dest):''}</div></div>`;
  Object.keys(tr.weather).sort().forEach(d=>{
    html += `<div class="cell"><div class="name">${d}</div><div>${tr.weather[d]}</div></div>`;
  });
  box.innerHTML = html;
}

function pendingEvents(){
  const y = String(state.year);
  return state.events
    .filter(e => e.date.startsWith(y) && e.status === 'planificado')
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function showPending(){
  const list = pendingEvents();
  const box = document.getElementById('pendingBox');
  const card = document.getElementById('pendingCard');
  let html = `<h2 style="margin:0 0 8px">${t('pendingTitle')}</h2><p style="color:var(--muted);margin:0 0 12px">${t('pendingHint')}</p>`;
  if (!list.length) html += `<p>${t('pendingNone')}</p>`;
  else {
    html += `<div class="inset">`;
    list.forEach(e=>{
      const tp = typeById(e.typeId);
      html += `<div class="cell"><div class="left"><div class="name">${e.date} · ${esc(tp?tp.name:t('event'))}</div>
        <div class="meta">${esc(e.note||'')}</div></div>
        <span class="status-pill st-plan">${t('stPlanned')}</span></div>`;
    });
    html += `</div>`;
  }
  html += `<div class="rowbtns"><button class="btn pri" onclick="document.getElementById('pendingBox').classList.remove('on')">${t('ok')}</button></div>`;
  card.innerHTML = html;
  box.classList.add('on');
}

load();
render();
if (state.sb && state.sb.url && state.sb.key) loadFromSupabase(true);
else { sbReady = true; if (state.gh && state.gh.token && state.gh.owner && state.gh.repo) loadFromGitHub(); }
ensureDir().then(h => { if (h) importFromFolderOrFile(); });
